<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nincs internet</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #29494F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    color: #ffffff;
  }

  .box {
    text-align: center;
    max-width: 320px;
    padding: 20px;
  }

  .icon {
    width: 120px;
    margin-bottom: 20px;
  }

  .title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .sub {
    font-size: 14px;
    opacity: 0.75;
    margin-bottom: 20px;
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #6fd08c;
    color: #0b3b23;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  button:active {
    opacity: 0.85;
  }

  .hint {
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.6;
  }
</style>
</head>

<body>
<div class="box">

  <img class="icon" src="data:image/png;base64,<!-- MARAD A KÉPED -->">

  <div class="title">Nincs internetkapcsolat</div>
  <div class="sub">
    Ha ESP WiFi-re csatlakoztál,<br>
    itt be tudod állítani az eszközt.
  </div>

  <button onclick="openESP()">ESP WiFi beállítása</button>

  <div class="hint">
    Csak akkor működik,<br>
    ha az ESP WiFi-jén vagy
  </div>

</div>

<script>
function openESP() {
  window.location.href = "http://192.168.4.1";
}
</script>
</body>
</html>
